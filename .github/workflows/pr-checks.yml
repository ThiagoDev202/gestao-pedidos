name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
      has_frontend: ${{ steps.exists.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: if [ -f frontend/package.json ]; then echo frontend=true >> "$GITHUB_OUTPUT"; else echo frontend=false >> "$GITHUB_OUTPUT"; fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend: ['backend/**']
            frontend: ['frontend/**']
            e2e: ['backend/**', 'frontend/**', 'database/**', 'docker-compose.yml']
            docker: ['docker-compose.yml', '**/Dockerfile', '**/.dockerignore', 'database/**']

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-docs-drift.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror
      - name: Unit tests
        run: dotnet test tests/GestaoPedidos.UnitTests --no-build -c Release
      - name: Architecture tests
        run: dotnet test tests/GestaoPedidos.ArchitectureTests --no-build -c Release
      - name: Integration tests (SQL Server via Testcontainers)
        run: dotnet test tests/GestaoPedidos.IntegrationTests --no-build -c Release

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Unit tests in a time zone ahead of UTC
        run: TZ=Pacific/Kiritimati npm test -- --run
      - run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true' && needs.changes.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the full stack
        run: docker compose up --build --wait --wait-timeout 300
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, docs-drift, backend, frontend, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::job com resultado $r"; exit 1 ;; esac
          done
